host: localhost:8080
info:
  contact: {}
  description: REST API for The Triangle newspaper CMS
  title: Triangle CMS API
  version: "1.0"
paths:
  /v1/activity:
    get:
      parameters:
      - default: 100
        description: Max events
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ActivityResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get recent CMS activity
      tags:
      - activity
  /v1/articles:
    get:
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Max results
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      - default: 50
        description: Max words in excerpt
        in: query
        name: excerpt_words
        type: integer
      - description: Filter by author slug
        in: query
        name: author_slug
        type: string
      - description: Filter by section slug
        in: query
        name: section_slug
        type: string
      - description: Filter by subsection slug
        in: query
        name: subsection_slug
        type: string
      - description: Filter by status. Ignored for unauthenticated callers, who always
          get published only.
        enum:
        - draft
        - published
        in: query
        name: status
        type: string
      - description: When true, return only soft-deleted articles. Ignored for unauthenticated
          callers.
        in: query
