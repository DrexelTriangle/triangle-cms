host: localhost:8080
info:
  contact: {}
  description: REST API for The Triangle newspaper CMS
  title: Triangle CMS API
  version: "1.0"
paths:
  /v1/activity:
    get:
      parameters:
      - default: 100
        description: Max events
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ActivityResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get recent CMS activity
      tags:
      - activity
  /v1/articles:
    get:
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Max results
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      - default: 50
        description: Max words in excerpt
        in: query
        name: excerpt_words
        type: integer
      - description: Filter by author slug
        in: query
        name: author_slug
        type: string
      - description: Filter by section slug
        in: query
        name: section_slug
        type: string
      - description: Filter by subsection slug
        in: query
        name: subsection_slug
        type: string
      - description: Filter by status
        enum:
        - draft
        - published
        in: query
        name: status
        type: string
      - description: When true, return only soft-deleted articles
        in: query
        name: archived
        type: boolean
      - description: Filter by title (partial match)
        in: query
        name: title
        type: string
      - description: Filter by slug (partial match)
        in: query
        name: slug
        type: string
      - description: Sort field
        enum:
        - title
        - slug
        - creation_date
        - published_date
        - status
        - comment_status
        in: query
        name: sort_by
        type: string
      - description: Sort direction
        enum:
        - asc
        - desc
        in: query
        name: sort_direction
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ArticlesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: List articles
      tags:
      - articles
    post:
      consumes:
      - application/json
      parameters:
      - description: Article
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.ArticleInput'
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an article
      tags:
      - articles
  /v1/articles/{slug}:
    delete:
      parameters:
      - description: Article slug
        in: path
        name: slug
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete an article
      tags:
      - articles
    get:
      parameters:
      - description: Article slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ArticleDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get an article by slug
      tags:
      - articles
    patch:
      consumes:
      - application/json
      parameters:
      - description: Article slug
        in: path
        name: slug
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.ArticlePatch'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Partially update an article
      tags:
      - articles
    put:
      consumes:
      - application/json
      parameters:
      - description: Article slug
        in: path
        name: slug
        required: true
        type: string
      - description: Article
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.Article'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
