# Install as a host Nginx site, for example:
#   /etc/nginx/sites-available/triangle-cms.conf
# and symlink into sites-enabled. The active slot include is generated by the
# deploy/rollback scripts.
#
# Initial deployment intentionally uses HTTP and server_name _. It will work via
# Delta's VPN IP or hostname. When cms.thetriangle.org is ready, replace
# server_name and add HTTPS/TLS termination here; the backend should remain
# internal HTTP behind Nginx.

server {
    listen 80;
    server_name _;

    include /etc/nginx/triangle-cms/active-upstreams.conf;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /swagger {
        return 301 /swagger/;
    }

    location /swagger/ {
        proxy_pass $triangle_cms_backend;
    }

    location = /v1 {
        proxy_pass $triangle_cms_backend;
    }

    location /v1/ {
        # POST /v1/media accepts up to MEDIA_MAX_UPLOAD_BYTES (90 MiB by
        # default -- the legacy corpus has full-res camera originals near 77
        # MiB). Nginx's own default is 1m, so without this it rejects any
        # ordinary phone photo with a 413 before the request reaches the CMS,
        # and the app-side limit never gets a say. Keep this at or above the
        # backend's limit so the backend is the one that decides.
        client_max_body_size 91m;
        # A 90 MiB body over a slow uplink takes minutes; the stock 60s applies
        # per read, but raise the ceilings so a stalled-but-alive upload is not
        # killed mid-flight.
        client_body_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass $triangle_cms_backend;
    }

    # Legacy WordPress media, migrated to CephFS. Static, read-only, images only.
    # The CMS upload endpoint (backend container) is the only writer; Nginx just
    # reads. There is no PHP/FastCGI handler here, so nothing can execute even if
    # a script file slipped into the corpus.
    location /wp-content/ {
        root /mnt/cephfs/media;              # /wp-content/x -> /mnt/cephfs/media/wp-content/x
        try_files $uri =404;                 # never fall through to the app
        autoindex off;
        limit_except GET HEAD { deny all; }

        # Refuse to serve executables/scripts outright (there were .php/.exe
        # web-shells on the WP origin; the rsync excluded them, this is defense
        # in depth).
        location ~* \.(php\d?|phtml|phar|cgi|pl|py|sh|exe|asp|aspx|jsp)$ { return 403; }

        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'" always;
        # Filenames encode the exact size, so files are immutable. Set this only
        # via add_header -- `expires` would emit a second, weaker Cache-Control
        # and CDNs disagree about which duplicate wins.
        #
        # Deliberately NOT `always`: that flag also stamps 30-day-immutable onto
        # 404s, and Cloudflare then pins "this file does not exist" at the edge
        # for a month. Any file added to the corpus after something first
        # requested it stays invisible until the TTL expires or someone purges --
        # a migrated image that is provably on disk and served fine by this nginx
        # still 404s publicly, which reads as a failed copy rather than a cache
        # hit. Without the flag add_header applies only to 2xx/3xx, so misses
        # fall back to Cloudflare's short default 404 TTL and self-heal.
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Never serve dotfiles (keep ACME http-01 working if it is ever added here).
    location ~ /\.(?!well-known) { deny all; }

    # Static maintenance page, served when the frontend upstream cannot be
    # reached. `internal` means it is reachable ONLY via the error_page rewrite
    # below -- never as its own URL. That matters: a publicly fetchable
    # /_down.html is a 200 that Cloudflare will happily cache and that search
    # engines will index, and it gives uptime checks a URL that reports "up"
    # while the site is down.
    location = /_down.html {
        internal;
        alias /var/www/triangle-cms-down/down.html;

        # The whole point of this page is that it is transient. Without
        # no-store, Cloudflare can pin "the site is down" at the edge and keep
        # serving it after the backend is healthy again -- the same failure mode
        # that the /wp-content/ 404 caching note above describes, except here it
        # takes down every page at once.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Retry-After 60 always;
        add_header X-Robots-Tag "noindex" always;
    }

    location / {
        proxy_pass $triangle_cms_frontend;

        # Fires when Nginx itself cannot complete the proxy: connection refused
        # (no container listening on the active slot's port), or a read timeout.
        #
        # `proxy_intercept_errors` is deliberately left OFF. Turning it on would
        # also swallow error responses the frontend generates on purpose and
        # replace them with this page, which hides real application behaviour.
        # "Failure" here means the upstream is unreachable, not that it answered
        # with something we dislike.
        #
        # =503 normalises 502/504 into the one status that actually means "try
        # again shortly" and pairs with the Retry-After above. The original code
        # is not lost -- it stays in error.log, which is where you diagnose from
        # anyway.
        #
        # This is an internal rewrite, NOT an HTTP redirect. A 302 to a down
        # page would be actively harmful: uptime checks follow redirects, land
        # on a 200, and report the site as healthy through the entire outage.
        # The client must see 503 on the URL it asked for.
        error_page 502 503 504 =503 /_down.html;
    }
}
