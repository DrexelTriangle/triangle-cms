# Delta application stack: two complete release slots. Delta runs only the
# frontend containers, backend containers, host Nginx, and the self-hosted
# GitHub Actions runner. MariaDB/MaxScale live elsewhere; the backend receives
# their reachable address through DB_* environment variables.
#
# Deployments start the inactive slot, wait for both container health checks,
# then atomically switch host Nginx to the matching frontend/backend pair.
#
# Required host-only env file: cms.env. It must not be committed.

name: triangle-cms

x-backend-base: &backend-base
  image: ${CMS_BACKEND_IMAGE:-ghcr.io/drexeltriangle/triangle-cms-backend}:${CMS_IMAGE_TAG:?CMS_IMAGE_TAG is required}
  restart: unless-stopped
  stop_grace_period: 15s
  environment:
    CMS_SERVER_MODE: internal-http
    DB_NAME: ${DB_NAME:?DB_NAME is required}
    DB_USER: ${DB_USER:?DB_USER is required}
    DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    DB_HOST: ${DB_HOST:?DB_HOST is required}
    DB_PORT: ${DB_PORT:-3306}
    OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?OIDC_ISSUER_URL is required}
    OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?OIDC_CLIENT_ID is required}
    OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET is required}
    FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
    OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?OIDC_REDIRECT_URI is required}
    CMS_SESSION_TTL_SECONDS: ${CMS_SESSION_TTL_SECONDS:-604800}
    CMS_REBUILD_TAXONOMY_COUNTS_ON_STARTUP: ${CMS_REBUILD_TAXONOMY_COUNTS_ON_STARTUP:-false}
    SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
    AKISMET_API_KEY: ${AKISMET_API_KEY:-}
    AKISMET_BLOG_URL: ${AKISMET_BLOG_URL:-}
    # Media: legacy WP uploads migrated to CephFS. The upload endpoint writes new
    # assets under MEDIA_ROOT; MEDIA_BASE_URL is the public host that serves them.
    MEDIA_ROOT: ${MEDIA_ROOT:-/mnt/cephfs/media}
    MEDIA_BASE_URL: ${MEDIA_BASE_URL:-}
    # Mount guard. The bind below silently creates an empty host directory when
    # CephFS is not mounted, and uploads into it look successful right up until
    # the mount is repaired and shadows them. This path must exist under
    # MEDIA_ROOT or the backend refuses to store anything. Set it empty only for
    # an install with no migrated corpus.
    MEDIA_ROOT_SENTINEL: ${MEDIA_ROOT_SENTINEL-wp-content/uploads}
    # Per-file upload cap. Must stay at or below Nginx's client_max_body_size
    # (91m) and below Cloudflare's 100 MB tunnel limit; raise all of them
    # together or the smallest one silently wins.
    MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-94371840}
    # Semantic search. Shared by both slots -- the sidecar is stateless, so there
    # is no reason to run one per slot. Leave empty to run lexical-only search:
    # the backend then skips query embedding and its reconciler exits at start.
    EMBEDDINGS_URL: ${EMBEDDINGS_URL-http://embeddings:8000}
  volumes:
    # CephFS media tree (host). rw so the upload endpoint can store new files;
    # host Nginx serves the same tree read-only (see deploy/nginx/triangle-cms.conf).
    - ${MEDIA_HOST_PATH:-/mnt/cephfs/media}:/mnt/cephfs/media:rw
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/v1/health/db || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s
  networks:
    - triangle_net

x-frontend-base: &frontend-base
  image: ${CMS_FRONTEND_IMAGE:-ghcr.io/drexeltriangle/triangle-cms-frontend}:${CMS_IMAGE_TAG:?CMS_IMAGE_TAG is required}
  restart: unless-stopped
  stop_grace_period: 10s
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 10s
  networks:
    - triangle_net

services:
  # One shared instance, not one per slot: it holds no state, so both slots can
  # use it and a deploy never has to wait for a model to load. Not exposed to the
  # host -- only the backends talk to it, over the internal network.
  embeddings:
    # Tagged by content, not by commit: CMS_EMBEDDINGS_TAG is the git tree hash
    # of embeddings/, so it only changes when the sidecar itself changes. Tagging
    # it with the commit SHA meant every deploy pulled a "new" image and
    # recreated the container, reloading the model for ~60s each time, even for
    # commits that touched nothing but Go code. deploy.sh derives the value.
    image: ${CMS_EMBEDDINGS_IMAGE:-ghcr.io/drexeltriangle/triangle-cms-embeddings}:${CMS_EMBEDDINGS_TAG:?CMS_EMBEDDINGS_TAG is required}
    restart: unless-stopped
    stop_grace_period: 10s
    # Delta has 6 cores. Left uncapped, the backfill after a reseed pins nearly
    # all of them for over an hour (measured: 579% of 600%, load average 5.4)
    # and would starve the backends of the CPU they need to serve requests.
    #
    # Both settings are needed, and they should match. cpus is a cgroup ceiling;
    # without OMP_NUM_THREADS, onnxruntime still spawns one thread per visible
    # core and thrashes against that ceiling instead of respecting it.
    #
    # This trades backfill throughput for headroom -- roughly 2 articles/sec
    # becomes 1.4 -- which is the right way round: the backfill is background
    # work that converges on its own, and nothing waits on it.
    cpus: ${EMBED_CPUS:-4}
    environment:
      # Must match the WordPress ETL's --embedding-model. Vectors from two
      # different models share a table but not a coordinate space, so a mismatch
      # corrupts ranking silently rather than failing.
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-small-en-v1.5}
      OMP_NUM_THREADS: ${EMBED_CPUS:-4}
    healthcheck:
      # /health 503s until the model is loaded.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - triangle_net

  backend-blue:
    <<: *backend-base
    ports:
      - "127.0.0.1:8081:8080"

  frontend-blue:
    <<: *frontend-base
    ports:
      - "127.0.0.1:8091:8080"

  backend-green:
    <<: *backend-base
    ports:
      - "127.0.0.1:8082:8080"

  frontend-green:
    <<: *frontend-base
    ports:
      - "127.0.0.1:8092:8080"

networks:
  triangle_net:
    driver: bridge
