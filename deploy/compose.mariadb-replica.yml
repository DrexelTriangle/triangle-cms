# Triangle CMS — MariaDB READ REPLICA, deployed on its OWN physical server
# (separate from the primary and from the CMS/app host). It replicates
# asynchronously from the primary over the network via GTID.
#
# Replication is established with a one-time provisioning step (dump the primary
# with GTID position, load it here, then CHANGE MASTER / START SLAVE) — see
# deploy/mariadb/README.md. This compose only runs the tuned server; it does NOT
# auto-create the app database (data arrives via replication).
#
# Usage on the replica host:
#   docker compose -f compose.mariadb-replica.yml --env-file cms.env up -d
#   ./mariadb/setup-replica.sh          # one-time, after the primary is up

name: triangle-mariadb-replica

services:
  mariadb-replica:
    image: mariadb:11.7
    restart: unless-stopped
    command: ["--log-error=/var/lib/mysql/error.log"]
    environment:
      # Root only: the app schema/users arrive via replication, so we deliberately
      # do NOT set MARIADB_DATABASE/MARIADB_USER here (that would create diverging
      # local objects and fight the replicated stream).
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
    volumes:
      - mariadb_replica_data:/var/lib/mysql
      - ./mariadb/replica.cnf:/etc/mysql/conf.d/replica.cnf:ro,z
      - ./mariadb/setup-replica.sh:/opt/setup-replica.sh:ro,z
    # Expose reads to the CMS host only; firewall to the app server's IP.
    ports:
      - "${MARIADB_REPLICA_BIND_ADDR:-127.0.0.1}:${MARIADB_PORT_FORWARD:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mariadb_replica_data:
