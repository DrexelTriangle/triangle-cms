# Observability stack (Loki + Promtail + Grafana + Prometheus), deployed and
# upgraded independently of the CMS. This is intentionally a SEPARATE Compose
# project from compose.cms.yml: a CMS deploy must never `docker compose down`
# this stack, and an observability change must never touch the CMS slots or
# MariaDB.
#
# Promtail collects container logs through the Docker daemon API, and Prometheus
# scrapes each CMS slot's /metrics over the host gateway. Both therefore work
# regardless of the CMS living in a different Compose project on its own network.
#
# Usage (from this directory):
#   docker compose -f compose.observability.yml --env-file <env> up -d
#
# Grafana admin credentials come from that env file (host-only, not committed).

name: triangle-observability

services:
  loki:
    image: grafana/loki:3.5.6
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    # Published on loopback ONLY, and on 13100 rather than 3100, so that host
    # Nginx can bind the natural :3100 for the outside world (see
    # nginx/triangle-loki.conf) without a port clash. Loki runs with
    # auth_enabled: false and has no authentication of its own, so nothing here
    # may ever be published to a routable address directly -- Nginx is what adds
    # basic auth and blocks the write path.
    ports:
      - "127.0.0.1:13100:3100"
    healthcheck:
      test: ["CMD", "loki", "-verify-config=true", "-config.file=/etc/loki/config.yaml"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ../observability/loki-config.yml:/etc/loki/config.yaml:ro,z
      - loki_data:/loki
    networks:
      - observability_net

  promtail:
    image: grafana/promtail:3.5.6
    restart: unless-stopped
    user: "0:0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["-config.file=/etc/promtail/config.yml"]
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ../observability/promtail-config.yml:/etc/promtail/config.yml:ro,z
      - promtail_positions:/tmp
      # Read-only Docker socket: Promtail discovers containers and streams their
      # logs through the daemon API rather than tailing files, because Delta's
      # `local` log driver writes binary logs that file-tailing cannot parse.
      # See the comment in promtail-config.yml. Note that :ro on the socket
      # limits nothing the daemon does -- the API is fully privileged either
      # way -- so this container is effectively root on the host, same as any
      # socket-mounted agent.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - observability_net

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # Whole directories rather than the single loki.yml file, so adding a
      # datasource or dashboard is a file drop rather than a Compose edit.
      - ../observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro,z
      - ../observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro,z
      - ../observability/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro,z
    networks:
      - observability_net

  # Probes MaxScale's client listener from Delta. This is the only thing in the
  # stack that can report the database tier being unreachable: MaxScale's own
  # alert script cannot, because a dead MaxScale sends nothing. See
  # ../observability/blackbox/blackbox.yml for why it is a TCP connect on :4006
  # rather than the admin API.
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ../observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro,z
    # No ports published: only Prometheus talks to it, over the internal
    # network. It probes OUTWARD to the MaxScale host, which needs no inbound
    # exposure here.
    networks:
      - observability_net

  # Delivers Prometheus's database-tier alerts to Discord. Deliberately NOT
  # Grafana's built-in alerting: Delta's Prometheus is only a DATASOURCE for the
  # Triangle Grafana, so a Grafana-owned rule would disappear when the local
  # instance is retired -- while the metric kept being scraped and the dashboards
  # kept looking healthy. Keeping rule and delivery next to the data means
  # neither depends on which Grafana is in front.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,z
      # The Discord webhook, host-side and never in git. Alertmanager does no
      # environment substitution in its config, so the URL is read from this
      # path rather than injected -- same reasoning as MaxScale's alert.env.
      - ${DISCORD_WEBHOOK_FILE:-/etc/triangle-observability/discord-webhook}:/etc/alertmanager/discord-webhook:ro
      - alertmanager_data:/alertmanager
    # Loopback only, and on 19093 to match the 1-prefixed convention the other
    # loopback services here use. Alertmanager has no authentication of its own
    # and its API can silence alerts, so it must never reach a routable address.
    ports:
      - "127.0.0.1:19093:9093"
    networks:
      - observability_net

  prometheus:
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Match Loki's two-week retention so the two halves of the dashboard
      # cover the same window and neither outgrows the disk it shares with the
      # CMS.
      - "--storage.tsdb.retention.time=14d"
    # Loopback only, on 19090 so host Nginx can bind the natural 9090 for the
    # Triangle Grafana (see nginx/triangle-prometheus.conf). Prometheus has no
    # authentication of its own, so this must never be published to a routable
    # address directly. Note that --web.enable-admin-api and
    # --web.enable-lifecycle are deliberately absent above: without them the
    # delete-series, reload and quit endpoints do not exist at all.
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ../observability/prometheus/prometheus.delta.yml:/etc/prometheus/prometheus.yml:ro,z
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro,z
      - prometheus_data:/prometheus
    # Prometheus joins the CMS project's network read-only so it can scrape the
    # slots by container name.
    #
    # The host gateway does NOT work here, which is easy to get wrong: the CMS
    # slots publish to 127.0.0.1:8081/8082, loopback only, so a container
    # reaching for the gateway address (172.17.0.1) gets connection refused.
    # Joining the network reaches the containers on their own port 8080 instead,
    # and needs no change to compose.cms.yml and no new host exposure.
    networks:
      - observability_net
      - cms_net

volumes:
  alertmanager_data:
  loki_data:
  promtail_positions:
  grafana_data:
  prometheus_data:

networks:
  observability_net:
    driver: bridge
  # The CMS project's network, created by compose.cms.yml. Declared external so
  # this stack attaches to it rather than owning it -- nothing here can create,
  # modify, or remove it. The cost of this is a real ordering dependency: the
  # CMS stack must be up before this one starts, or Compose fails with a missing
  # network instead of silently scraping nothing.
  cms_net:
    external: true
    name: triangle-cms_triangle_net
