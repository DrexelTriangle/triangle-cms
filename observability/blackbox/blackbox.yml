# blackbox_exporter modules for deploy/compose.observability.yml.
#
# Purpose: probe MaxScale's client listener from OUTSIDE the database tier.
# Everything else in this stack watches the CMS itself, which cannot report the
# one failure that matters most here — MaxScale being dead. Since the write path
# is fenced so that MaxScale is the ONLY route to the databases (see
# deploy/mariadb/README.md), MaxScale down is a total outage, and MaxScale's own
# alert script cannot report it: the process that would send the alert is the
# process that died.
#
# A TCP connect against :4006 is deliberately chosen over the MaxScale REST API:
#   - 4006 is the port the CMS actually uses, so this tests the real dependency
#     rather than a management interface that could be healthy while routing is
#     not.
#   - It needs no new exposure. The admin API (8989) would have to be opened to
#     Delta, and it can reconfigure MaxScale, so it is a far worse thing to
#     expose than a port the CMS already talks to.
#   - MaxScale 24.02 serves no Prometheus endpoint (verified: /metrics and
#     /v1/metrics both 404), so scraping it directly is not an option anyway.

modules:
  # Plain TCP handshake. We do NOT speak the MySQL protocol here: MaxScale sends
  # a server greeting on connect, and completing a real login would need
  # credentials in this file. Accepting the connection is sufficient evidence
  # that MaxScale is alive and listening.
  tcp_connect:
    prober: tcp
    # Comfortably under Prometheus's scrape_timeout so a slow probe surfaces as
    # a failed probe rather than a scrape error, which would alert differently.
    timeout: 5s
    tcp:
      ip_protocol_fallback: false
      preferred_ip_protocol: ip4
