# Delta scrape config, for deploy/compose.observability.yml.
#
# Two differences from the dev config, both structural rather than cosmetic:
#
#   1. Plain HTTP. Delta runs the backend with CMS_SERVER_MODE=internal-http
#      behind Nginx, so the slots speak HTTP on their loopback ports. Scraping
#      https:// here fails the handshake and the dashboard shows no data.
#
#   2. Both slots, always. Blue and green both run permanently and only one is
#      wired up in Nginx, so scraping "the backend" is not a single target. Each
#      carries a `slot` label; `up{job="cms"}` will legitimately show two series.
#      Which one is live is decided by Nginx, not by anything Prometheus can
#      see -- see the blue/green section in deploy/README.md.
#
# Targets are container names on the CMS project's network, which Prometheus
# joins (see compose.observability.yml). Going via the host gateway does not
# work: the slots publish to 127.0.0.1 only, so the gateway address refuses the
# connection. Port 8080 is the in-container port, not the published one.

global:
  scrape_interval: 15s

# Alerting lives here rather than in Grafana so it survives the switch to the
# Triangle Grafana, for which this Prometheus is only a datasource. A
# Grafana-owned rule would vanish with the local instance while the metric kept
# being scraped — dashboards fine, alerts silently gone.
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The job name must stay "cms": the provisioned dashboard filters on
  # job="cms" in queries like up{job="cms"} and go_goroutines{job="cms"}.
  - job_name: cms
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["triangle-cms-backend-blue-1:8080"]
        labels:
          slot: blue
      - targets: ["triangle-cms-backend-green-1:8080"]
        labels:
          slot: green

  # Watchdog for the database tier's single point of failure.
  #
  # The write path is fenced so MaxScale is the ONLY route to the databases, so
  # MaxScale being down is a total outage — and it is precisely the outage
  # MaxScale's own alert script cannot report, because the process that would
  # send the alert is the one that died. This probes it from Delta instead.
  #
  # DB1/DB2 are deliberately NOT probed here: their 3306 is firewalled to the
  # MaxScale host and the DB peer, so Delta cannot reach them by design, and a
  # target that can never succeed is a permanently firing alert.
  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["10.248.40.183:4006"]
        labels:
          service: maxscale
    # The standard blackbox indirection: Prometheus scrapes the EXPORTER, and
    # the real target travels as a query parameter. Without this rewrite
    # Prometheus would try to scrape 10.248.40.183:4006 as if it served metrics.
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
