# Database-tier alerting rules, evaluated by Prometheus and routed to Discord by
# Alertmanager.
#
# This lived in Grafana's provisioned alerting until 2026-08-05. It moved here so
# it survives the switch to the Triangle Grafana: Delta's Prometheus is a
# DATASOURCE for that Grafana, not part of it, so a rule that lives in Prometheus
# keeps evaluating no matter which Grafana is in front — while a Grafana-owned
# rule would have disappeared with the local instance, silently. The metric would
# have kept being scraped and the dashboards would have looked fine; only the
# alert would have gone missing, which is the failure mode you never notice.

groups:
  - name: database-tier
    interval: 30s
    rules:
      # The one outage MaxScale's own alert script can never report: itself.
      # The write path is fenced so MaxScale is the only route to the databases,
      # so this is a total outage, not a degraded read path.
      - alert: MaxScaleUnreachable
        expr: probe_success{service="maxscale"} == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "MaxScale is not accepting connections"
          detail: "The CMS cannot reach the database at all. Check `systemctl status maxscale`, then `maxctrl list servers`."

      # Replaces Grafana's noDataState: Alerting. If the probe series stops
      # existing, nobody is watching the database tier — the cause is Prometheus
      # or blackbox rather than MaxScale, but the consequence is the same, so it
      # is not allowed to fail open.
      - alert: MaxScaleProbeMissing
        expr: absent(probe_success{service="maxscale"})
        for: 5m
        labels:
          severity: warning
          component: observability
        annotations:
          summary: "MaxScale probe has stopped reporting"
          detail: "Nothing is watching the database tier. Check the blackbox exporter on Delta."
