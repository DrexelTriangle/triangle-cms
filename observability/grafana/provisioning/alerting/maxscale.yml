# The MaxScale watchdog MOVED OUT of Grafana on 2026-08-05.
#
# It now lives in Prometheus and Alertmanager:
#   observability/prometheus/rules/database.yml
#   observability/alertmanager/alertmanager.yml
#
# Why: Delta's Prometheus is a DATASOURCE for the Triangle Grafana, not part of
# it. A Grafana-owned alert rule would have disappeared the moment the local
# Grafana was retired — while blackbox kept probing, Prometheus kept scraping,
# and every dashboard kept looking healthy. The only symptom would have been an
# alert that never arrived. The rule now sits next to the data it reads, so it
# does not care which Grafana is in front.
#
# THIS FILE MUST STAY. Grafana's file provisioning only ever adds and updates —
# deleting a definition from disk leaves the object live in the database, so
# these directives are the only supported way to remove what earlier versions of
# this file created. They are idempotent, so re-running them costs nothing.
#
# ORDER MATTERS, and getting it wrong CRASH-LOOPS GRAFANA. A contact point that
# a notification policy still references cannot be deleted:
#
#   ProvisioningServiceImpl run error: contact points:
#   [alerting.notifications.contact-points.referenced]
#
# and Grafana exits rather than starting without its provisioning applied.
# Removing the `policies:` block from this file does NOT drop the policy — same
# add-and-update-only rule — so the reference survives and blocks the delete.
# `resetPolicies` restores the default routing tree, which frees the reference.
# It is applied in a separate pass from the deletes, hence the two-step comment
# below.
apiVersion: 1

# Step 1 — hand routing back to Grafana's default policy, so nothing references
# the contact points that step 2 removes.
resetPolicies:
  - 1

deleteRules:
  - orgId: 1
    uid: maxscale-unreachable

# Step 2 — safe only once the policy above no longer points at them. If Grafana
# ever crash-loops on the `referenced` error again, comment this block out,
# start Grafana to let resetPolicies apply, then restore it.
deleteContactPoints:
  - orgId: 1
    uid: slack-triangle-receiver
  - orgId: 1
    uid: discord-triangle-receiver
