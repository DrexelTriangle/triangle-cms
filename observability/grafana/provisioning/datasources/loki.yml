apiVersion: 1

datasources:
  - name: Loki
    type: loki
    # Fixed, explicit UID. The provisioned dashboard binds its panels to
    # datasources by UID, so an auto-generated one would leave every Loki panel
    # pointing at a datasource that does not exist on a fresh Grafana.
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
