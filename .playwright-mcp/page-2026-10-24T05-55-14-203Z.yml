                - rowgroup [ref=f15e28]:
                  - row [ref=f15e29]:
                    - cell [ref=f15e30]:
                      - paragraph [ref=f15e31]:
                        - generic [ref=f15e33]:
                          - text: Philadelphia Mayor Cherelle Parker has
                          - link "proposed a tax intended to bolster funds for the local school district" [ref=f15e34] [cursor=pointer]:
                            - /url: https://cms.thetriangle.org/wp-admin/admin-ajax.php?action=tnptr&nltr=MzE7MztodHRwczovL3RoZXRyaWFuZ2xlLm9yZy9hcnRpY2xlL2NpdHktY291bmNpbC10by12b3RlLW9uLXJpZGVzaGFyZS10YXg7O2I3NGNiYWE1YjEyOTBiM2M5Yjg2ODkyYjJkN2Y3YmM0
                          - text: to prevent staffing cuts. Colloquially known as “the dollar tax,” Parker intends to include an additional one dollar on rideshare fares in the city, hoping to generate $48 million in revenue for Philly public schools.
