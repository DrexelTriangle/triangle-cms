                        - generic [ref=f15e25]:
                          - text: Every year, on the last Wednesday of April, Denim Day serves as a reminder and a worldwide campaign to raise awareness about sexual violence while having
                          - link "conversations about sex education" [ref=f15e26] [cursor=pointer]:
