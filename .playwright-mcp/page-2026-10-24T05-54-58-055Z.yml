                    - paragraph [ref=f8e31]:
                      - generic [ref=f8e33]:
                        - text: Philadelphia Mayor Cherelle Parker has
                        - link "proposed a tax intended to bolster funds for the local school district" [ref=f8e34] [cursor=pointer]:
                          - /url: https://cms.thetriangle.org/wp-admin/admin-ajax.php?action=tnptr&nltr=MzE7MztodHRwczovL3RoZXRyaWFuZ2xlLm9yZy9hcnRpY2xlL2NpdHktY291bmNpbC10by12b3RlLW9uLXJpZGVzaGFyZS10YXg7O2I3NGNiYWE1YjEyOTBiM2M5Yjg2ODkyYjJkN2Y3YmM0
