                      - paragraph [ref=f1e14]:
                        - generic [ref=f1e16]:
                          - text: Philly’s premier South Asian dance team, Broad Street Baadshahz, placed second at the Desi Dance Network national circuit after the
                          - link "strongest competitive season in the team’s 18-year history" [ref=f1e17] [cursor=pointer]:
