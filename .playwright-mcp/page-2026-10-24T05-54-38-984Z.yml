                      - paragraph [ref=f1e23]:
                        - generic [ref=f1e25]:
                          - text: Every year, on the last Wednesday of April, Denim Day serves as a reminder and a worldwide campaign to raise awareness about sexual violence while having
                          - link "conversations about sex education" [ref=f1e26] [cursor=pointer]:
                            - /url: https://cms.thetriangle.org/wp-admin/admin-ajax.php?action=tnptr&nltr=MzE7MztodHRwczovL3RoZXRyaWFuZ2xlLm9yZy9hcnRpY2xlL2RlbmltLWRheS1yYWlzZXMtYXdhcmVuZXNzLW9mLXNleHVhbC12aW9sZW5jZS1vbi1jYW1wdXM7O2VkYjExMDE0OWRhZDlkYWJkZGRjYjdlZWI4NjA3NzFl
